name: Animaciones de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *" # cada 12 horas
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Solo para leer .github/profile-3d.json (los colores del calendario 3D)
      - uses: actions/checkout@v5

      - name: Pac-Man y Bomberman
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman,bomberman

      - name: Calendario 3D
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json

      - name: Juntar el calendario 3D con las demás
        run: cp profile-3d-contrib/profile-3d-*.svg dist/

      # Se instala el paquete directamente (versión fija) en vez de usar su
      # acción: la acción instala la última versión sin fijar y hace commits
      # (incluso --amend + force push) en main.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Space Shooter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install gh-space-shooter==2.0.5
          gh-space-shooter ${{ github.repository_owner }} --output dist/space-shooter.webp

      # Tarjeta de estadísticas propia (datos reales de la API de GitHub; sin dependencias)
      - name: Estadísticas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/stats.mjs ${{ github.repository_owner }} dist/stats.svg

      # Una sola publicación: esta acción REEMPLAZA toda la rama output, así que
      # todas las animaciones tienen que subirse juntas.
      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
