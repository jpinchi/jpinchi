name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *" # cada 12 horas
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar SVGs de la serpiente
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E040FB&color_dots=#ebedf0,#d8c4ff,#b388ff,#7F5AF0,#5b2bd6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF8A00&color_dots=#161b22,#3b2a6b,#5b3fb0,#7F5AF0,#E040FB

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
